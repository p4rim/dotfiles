# Use Vim motions when browsing scrollback in copy mode (prefix + [).
setw -g mode-keys vi

# Enable mouse-wheel scrolling through pane history.
set -g mouse on

# Share Neovim's system clipboard through Wayland.
set -s copy-command 'wl-copy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind p run-shell 'wl-paste --no-newline | tmux load-buffer -b system - && tmux paste-buffer -b system -d -p -t "#{pane_id}"'

# Scroll five lines with Alt+Up/Down, without pressing the prefix.
# Automatically leave copy mode when scrolling back to the bottom.
bind -n M-Up copy-mode -e \; send-keys -X -N 5 scroll-up
bind -n M-Down if-shell -F '#{pane_in_mode}' 'send-keys -X -N 5 scroll-down' ''
bind -T copy-mode-vi M-Up send-keys -X -N 5 scroll-up
bind -T copy-mode-vi M-Down send-keys -X -N 5 scroll-down

# Monochrome terminal: ASCII labels and reverse-video selection.
set -g status-position bottom
set -g status-style 'bg=black,fg=white'
set -g status-interval 5
set -g status-justify left
set -g status-left-length 28
set -g status-right-length 60
set -g status-left ' [SYS:#S] :: '
set -g status-right '#{?client_prefix,[CMD] ,}#{?pane_in_mode,[SCROLL] ,}:: %A %Y-%m-%d [%I:%M %p] '
setw -g window-status-format '[#I:#W#F]'
setw -g window-status-style 'bg=black,fg=white'
setw -g window-status-current-format '[#I:#W*]'
setw -g window-status-current-style 'bg=white,fg=black'
setw -g window-status-separator ' '
setw -g window-status-activity-style 'fg=white'
setw -g window-status-bell-style 'bg=white,fg=black'
set -g message-style 'bg=white,fg=black'
set -g mode-style 'bg=white,fg=black'
set -g pane-border-style 'fg=white'
set -g pane-active-border-style 'fg=white'
